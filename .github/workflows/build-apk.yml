name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://iozofoybmvyerkpieoov.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Jz-MIKjPSrPJWOjHW4fCTg_WtvITSsn

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Set up Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: 🛠️ Configure Signing & Build Android Release APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -PnewArchEnabled=false --no-daemon
          cd app/build/outputs/apk/release
          mv *.apk VileChat.apk || true

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vile-Chat-APK
          path: android/app/build/outputs/apk/release/VileChat.apk
          retention-days: 30
